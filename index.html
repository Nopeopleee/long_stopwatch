<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#071018" />
  <meta name="description" content="滴歲：把時間養成一隻會一直長大的碼表寵物。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="./icons/icon-192.webp" />
  <script>
    (() => {
      try {
        const preference = localStorage.getItem("dipai-theme") || "system";
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : preference;
        document.documentElement.dataset.theme = resolved;
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="./styles.css?v=award-v1" />
  <link rel="stylesheet" href="./journey.css?v=journey-v2" />
  <link rel="stylesheet" href="./share.css?v=share-v1" />
  <link rel="stylesheet" href="./mascot.css?v=growth-v3" />
  <style>
    .unlock-toast{position:fixed;z-index:60;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(470px,calc(100vw - 24px));display:grid;grid-template-columns:58px minmax(0,1fr) 34px;align-items:center;gap:12px;padding:13px 13px 13px 14px;border:1px solid var(--stroke-strong);border-radius:22px;background:linear-gradient(145deg,rgba(91,207,255,.09),rgba(139,241,215,.04)),var(--surface-solid);box-shadow:0 24px 70px rgba(0,0,0,.34);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,22px) scale(.98);transition:opacity .22s ease,transform .22s ease,visibility .22s ease}
    .unlock-toast.is-visible{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0) scale(1)}
    .unlock-toast-icon{width:54px;height:54px;display:grid;place-items:center;border:1px solid var(--stroke);border-radius:17px;background:var(--soft)}
    .unlock-toast-icon svg{width:50px;height:50px;display:block}
    .unlock-toast-copy{min-width:0;display:grid;gap:2px}.unlock-toast-copy span{color:var(--accent);font-size:.66rem;font-weight:800;letter-spacing:.12em}.unlock-toast-copy strong{font-size:.98rem;line-height:1.2}.unlock-toast-copy small{color:var(--muted);font-size:.76rem;line-height:1.4}
    .unlock-toast-dismiss{width:32px;height:32px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:1.35rem;line-height:1;cursor:pointer}.unlock-toast-dismiss:hover{background:var(--soft);color:var(--text)}
    @media(max-width:420px){.unlock-toast{grid-template-columns:50px minmax(0,1fr) 30px;padding:11px;border-radius:19px}.unlock-toast-icon{width:48px;height:48px;border-radius:15px}.unlock-toast-icon svg{width:44px;height:44px}}
  </style>
  <title>滴歲</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="app-shell">
    <header class="topbar home-topbar">
      <div class="brand-wrap" aria-label="滴歲">
        <span class="brand-drop" aria-hidden="true"></span>
        <div>
          <div class="brand">滴歲</div>
          <div class="brand-note">把時間養成一隻寵物</div>
        </div>
      </div>

      <a class="icon-link" href="./settings.html" aria-label="設定" title="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
          <path d="M19.1 12.9c.1-.6.1-1.2 0-1.8l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.6-.9L14.7 3h-4l-.4 3.2c-.6.2-1.1.5-1.6.9l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 1.8l-2 1.6 2 3.4 2.4-1c.5.4 1 .7 1.6.9l.4 3.2h4l.4-3.2c.6-.2 1.1-.5 1.6-.9l2.4 1 2-3.4-2-1.6Z"/>
        </svg>
      </a>
    </header>

    <section class="hero surface">
      <div class="hero-head">
        <div class="identity">
          <h1 id="title">我的碼表</h1>
          <div id="statusPill" class="status-pill stopped">尚未出生</div>
        </div>
        <div class="rank-orb">
          <span>目前稱號</span>
          <strong id="rankText">待機中的蛋</strong>
        </div>
      </div>

      <div class="time-stage" role="timer" aria-live="off" aria-label="已陪伴時間">
        <div class="ripple ripple-one" aria-hidden="true"></div>
        <div class="ripple ripple-two" aria-hidden="true"></div>
        <div class="ripple ripple-three" aria-hidden="true"></div>
        <div id="mascotStageShell" class="mascot-stage-shell" data-stage="dormant" aria-hidden="true">
          <span class="mascot-aura mascot-aura-one"></span>
          <span class="mascot-aura mascot-aura-two"></span>
          <svg id="mascotStage" class="mascot-stage" viewBox="0 0 240 280">
            <use id="mascotStageUse" href="./icons/mascots.svg#newborn"></use>
          </svg>
        </div>
        <div class="elapsed-wrap">
          <div class="days-row">
            <span id="days" class="days">0</span>
            <span class="unit">天</span>
          </div>
          <div class="clock-row">
            <span id="hours">00</span><span class="sep">:</span><span id="minutes">00</span><span class="sep">:</span><span id="seconds">00</span>
          </div>
          <div class="life-stage-chip" aria-label="目前生命階段">
            <span>生命階段</span>
            <strong id="lifeStageText">尚未出生</strong>
          </div>
        </div>
      </div>

      <div class="hero-bottom">
        <div class="meta">
          <span class="label">出生時間</span>
          <strong id="startedAtText">—</strong>
        </div>
        <div class="actions">
          <button id="startBtn" class="btn primary">開始養</button>
          <button id="renameBtn" class="btn">改名字</button>
        </div>
      </div>
    </section>

    <section class="milestones-card surface">
      <div class="milestone-head">
        <div>
          <span class="section-kicker">旅程</span>
          <h2>里程碑</h2>
          <p id="milestoneSummary" class="milestone-summary">旅程會從第一滴開始。</p>
        </div>
        <div class="milestone-head-actions">
          <span id="milestoneCount" class="milestone-count">0 / 17</span>
          <button id="shareAchievementBtn" class="share-entry" type="button" aria-label="分享滴歲成就卡" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.9 7.6-4.7M8.2 13.1l7.6 4.7"/></svg>
            <span>分享</span>
          </button>
        </div>
      </div>

      <div class="journey-glance" aria-label="里程碑摘要">
        <article class="journey-card journey-card-recent">
          <span class="journey-label">最近解鎖</span>
          <div class="journey-card-main">
            <div class="journey-badge" aria-hidden="true">
              <svg viewBox="0 0 64 64"><use id="recentMilestoneIcon" href="./icons/milestones.svg#spark"></use></svg>
            </div>
            <div class="journey-copy">
              <strong id="recentMilestoneTitle">還沒開始旅程</strong>
              <small id="recentMilestoneMeta">開始養之後才會累積里程碑</small>
            </div>
          </div>
        </article>

        <article class="journey-card journey-card-next">
          <span class="journey-label">下一個目標</span>
          <div class="journey-card-main">
            <div class="journey-badge" aria-hidden="true">
              <svg viewBox="0 0 64 64"><use id="nextMilestoneIcon" href="./icons/milestones.svg#spark"></use></svg>
            </div>
            <div class="journey-copy">
              <strong id="nextMilestoneTitle">第一滴</strong>
              <small id="nextMilestoneMeta">開始養後 1 小時</small>
            </div>
          </div>
        </article>
      </div>

      <div class="milestone-progress" aria-hidden="true"><span id="milestoneProgress"></span></div>

      <button id="milestoneToggle" class="milestone-toggle" type="button" aria-expanded="false" aria-controls="milestoneArchive">
        <span id="milestoneToggleText">查看全部 17 個里程碑</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
      </button>

      <div id="milestoneArchive" class="milestone-archive" hidden>
        <div class="milestone-archive-head">
          <strong>完整旅程</strong>
          <span>從第一滴到十年神話</span>
        </div>
        <div id="milestones" class="milestones"></div>
      </div>
    </section>

    <footer>
      <span>不用背景常駐，時間會一直長大。</span>
      <span class="footer-dot" aria-hidden="true">●</span>
    </footer>
  </main>

  <aside id="unlockToast" class="unlock-toast" aria-label="里程碑解鎖" hidden>
    <div class="unlock-toast-icon" aria-hidden="true">
      <svg viewBox="0 0 64 64"><use id="unlockToastIcon" href="./icons/milestones.svg#spark"></use></svg>
    </div>
    <div class="unlock-toast-copy">
      <span>旅程更新</span>
      <strong id="unlockToastTitle">里程碑解鎖</strong>
      <small id="unlockToastMeta">歡迎回來</small>
    </div>
    <button id="unlockToastDismiss" class="unlock-toast-dismiss" type="button" aria-label="關閉里程碑通知">×</button>
  </aside>

  <aside id="evolutionOverlay" class="evolution-overlay" aria-label="滴歲成長" hidden>
    <div class="evolution-rings" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="evolution-card">
      <button id="evolutionDismiss" class="evolution-dismiss" type="button" aria-label="關閉成長通知">×</button>
      <div class="evolution-mascot-wrap" aria-hidden="true">
        <svg viewBox="0 0 240 280"><use id="evolutionMascotUse" href="./icons/mascots.svg#baby"></use></svg>
      </div>
      <span class="evolution-kicker">滴歲長大了</span>
      <strong id="evolutionStageTitle">幼滴</strong>
      <small id="evolutionStageMeta">新的生命階段已解鎖</small>
    </div>
  </aside>

  <div id="liveStatus" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0"></div>

  <dialog id="shareDialog" class="share-dialog" aria-labelledby="shareDialogTitle">
    <div class="share-dialog-card">
      <header class="share-dialog-head">
        <div>
          <span class="dialog-kicker">分享旅程</span>
          <h2 id="shareDialogTitle">把這段陪伴做成一張卡</h2>
        </div>
        <button id="shareCloseBtn" class="share-close" type="button" aria-label="關閉分享成就卡">×</button>
      </header>

      <div class="share-format-switch" role="group" aria-label="分享圖片尺寸">
        <button class="share-format-option is-active" type="button" data-share-format="square" aria-pressed="true">
          <strong>1:1</strong><span>貼文</span>
        </button>
        <button class="share-format-option" type="button" data-share-format="story" aria-pressed="false">
          <strong>9:16</strong><span>限時動態</span>
        </button>
      </div>

      <div class="share-preview-shell">
        <canvas id="shareCanvas" class="share-canvas" width="1080" height="1080" aria-label="成就卡預覽"></canvas>
      </div>

      <p class="share-note">圖片只在這台裝置上即時產生，不會把滴歲資料上傳到伺服器。</p>

      <div class="share-dialog-actions">
        <button id="downloadShareBtn" class="btn" type="button" disabled>下載 PNG</button>
        <button id="nativeShareBtn" class="btn primary" type="button" disabled>分享圖片</button>
      </div>
    </div>
  </dialog>

  <dialog id="renameDialog">
    <form method="dialog" class="dialog-card" id="renameForm">
      <div class="dialog-kicker">改名字</div>
      <h2>這隻滴歲要叫什麼？</h2>
      <label>
        寵物名
        <input id="renameInput" maxlength="32" placeholder="我的碼表" autocomplete="off" />
      </label>
      <div class="dialog-actions">
        <button id="cancelRenameBtn" type="button" class="btn">取消</button>
        <button id="saveRenameBtn" type="button" class="btn primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script src="./common.js?v=award-v1"></script>
  <script src="./app.js?v=brand-v1"></script>
  <script src="./share-card.js?v=brand-v1"></script>
</body>
</html>
