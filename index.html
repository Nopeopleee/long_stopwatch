<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#0b0d10" />
  <meta name="description" content="滴派：可以養幾年都不怕爆表的長期碼表 PWA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="./icons/icon-192.webp" />
  <script>
    (() => {
      try {
        const preference = localStorage.getItem("dipai-theme") || "system";
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : preference;
        document.documentElement.dataset.theme = resolved;
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
  <title>滴派</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">滴派</div>
      <a class="nav-link" href="./settings.html" aria-label="設定">⚙️ 設定</a>
    </header>

    <section class="card hero">
      <div class="eyebrow">LONG-LIVED STOPWATCH PET</div>
      <h1 id="title">我的碼表</h1>
      <div id="statusPill" class="status-pill stopped">尚未出生</div>

      <div class="elapsed-wrap" aria-live="polite">
        <div class="days-row">
          <span id="days" class="days">0</span>
          <span class="unit">天</span>
        </div>
        <div class="clock-row">
          <span id="hours">00</span><span class="sep">:</span><span id="minutes">00</span><span class="sep">:</span><span id="seconds">00</span>
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta">
          <span class="label">出生時間</span>
          <strong id="startedAtText">—</strong>
        </div>
        <div class="meta">
          <span class="label">目前稱號</span>
          <strong id="rankText">待機中的蛋</strong>
        </div>
      </div>

      <div class="actions">
        <button id="startBtn" class="btn primary">開始養</button>
        <button id="renameBtn" class="btn">改名字</button>
      </div>
    </section>

    <section class="card">
      <h2>里程碑</h2>
      <div id="milestones" class="milestones"></div>
    </section>

    <footer>
      <span>不用背景常駐，顯示值 = 現在時間 − 出生時間。</span>
    </footer>
  </main>

  <dialog id="renameDialog">
    <form method="dialog" class="dialog-card" id="renameForm">
      <h2>幫寵物改名字</h2>
      <label>
        寵物名
        <input id="renameInput" maxlength="32" placeholder="我的碼表" autocomplete="off" />
      </label>
      <div class="dialog-actions">
        <button id="cancelRenameBtn" type="button" class="btn">取消</button>
        <button id="saveRenameBtn" type="button" class="btn primary">改名</button>
      </div>
    </form>
  </dialog>

  <script src="./common.js"></script>
  <script src="./app.js"></script>
</body>
</html>
