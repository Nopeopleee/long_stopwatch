<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#071018" />
  <meta name="description" content="滴歲設定" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="./icons/icon-192.webp" />
  <script>
    (() => {
      try {
        const preference = localStorage.getItem("dipai-theme") || "system";
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : preference;
        document.documentElement.dataset.theme = resolved;
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="./styles.css?v=award-v1" />
  <title>設定｜滴歲</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="app-shell settings-shell">
    <header class="settings-header">
      <a class="back-link" href="./" aria-label="返回滴歲首頁">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5 8.5 12l7 7"/></svg>
      </a>
      <div>
        <div class="settings-title">設定</div>
        <div class="settings-subtitle">讓滴歲照你的方式生活</div>
      </div>
    </header>

    <section class="settings-section" aria-labelledby="appearanceTitle">
      <h2 id="appearanceTitle" class="settings-section-title">外觀</h2>
      <div class="settings-list">
        <div class="settings-row">
          <div class="settings-icon settings-icon-accent" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42M7.06 16.94l-1.42 1.42"/><circle cx="12" cy="12" r="4"/></svg>
          </div>
          <div class="settings-copy">
            <strong>布景主題</strong>
            <span>淺色、深色或跟隨裝置</span>
          </div>
          <select id="themeSelect" class="settings-select" aria-label="布景主題">
            <option value="system">跟隨裝置</option>
            <option value="light">淺色</option>
            <option value="dark">深色</option>
          </select>
        </div>
      </div>
    </section>

    <section class="settings-section" aria-labelledby="dataTitle">
      <h2 id="dataTitle" class="settings-section-title">資料</h2>
      <div class="settings-list">
        <button id="exportBtn" type="button" class="settings-row settings-action">
          <span class="settings-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>
          </span>
          <span class="settings-copy">
            <strong>匯出備份</strong>
            <span>把名字與出生時間帶走</span>
          </span>
          <span class="settings-chevron" aria-hidden="true">›</span>
        </button>

        <button id="importBtn" type="button" class="settings-row settings-action">
          <span class="settings-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21V9m0 0 4 4m-4-4-4 4M5 7V4h14v3"/></svg>
          </span>
          <span class="settings-copy">
            <strong>匯入備份</strong>
            <span>從備份檔把滴歲接回來</span>
          </span>
          <span class="settings-chevron" aria-hidden="true">›</span>
        </button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </section>

    <section class="settings-section" aria-labelledby="appTitle">
      <h2 id="appTitle" class="settings-section-title">App</h2>
      <div class="settings-list">
        <button id="installBtn" type="button" class="settings-row settings-action" disabled>
          <span class="settings-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6"/></svg>
          </span>
          <span class="settings-copy">
            <strong>安裝到主畫面</strong>
            <span id="installStatus">檢查安裝狀態中…</span>
          </span>
          <span class="settings-chevron" aria-hidden="true">›</span>
        </button>
      </div>
    </section>

    <section class="settings-section danger-settings" aria-labelledby="dangerTitle">
      <h2 id="dangerTitle" class="settings-section-title">危險區</h2>
      <div class="settings-list danger-list">
        <button id="resetBtn" type="button" class="settings-row settings-action danger-row" aria-label="長按兩秒重置滴歲">
          <span class="settings-icon danger-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/></svg>
          </span>
          <span class="settings-copy">
            <strong>重置滴歲</strong>
            <span>長按 2 秒，這次旅程就會結束</span>
          </span>
          <span class="settings-chevron" aria-hidden="true">›</span>
          <span id="holdProgress" class="row-progress" aria-hidden="true"><span></span></span>
        </button>
      </div>
    </section>

    <p class="settings-footnote">滴歲的主要資料目前只存在這台裝置的瀏覽器裡。</p>
  </main>

  <script src="./common.js?v=award-v1"></script>
  <script src="./settings.js?v=brand-v1"></script>
</body>
</html>
